<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e140b" />
    <meta name="description" content="六条腿，六把武器，守住后院最后一截树桩！支持离线游玩的波次生存构筑割草肉鸽。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="六足战虫" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="六足战虫" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>六足战虫</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e140b;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0e140b;
        color: #f3e6c8;
        font-family: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 20px;
        text-align: center;
      }
      #rotate-hint .icon {
        font-size: 56px;
        animation: tilt 1.6s ease-in-out infinite;
      }
      @keyframes tilt {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-hint">
      <div class="icon">📱</div>
      <div>请把手机横过来玩</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
